<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz website</title>
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <div class="quiz-section">
      <div class="quiz" id="quiz">
        <h2 class="question" id="question">Quiz Question</h2>
        <hr />
        <ul>
          <li>
            <input type="radio" name="answer" class="answer" id="a" />
            <label for="a" id="option-1">Quiz option</label>
          </li>
          <li>
            <input type="radio" name="answer" class="answer" id="b" />
            <label for="b" id="option-2">Quiz option</label>
          </li>
          <li>
            <input type="radio" name="answer" class="answer" id="c" />
            <label for="c" id="option-3">Quiz option</label>
          </li>
        </ul>
        <hr />
        <div class="btn">
          <button type="submit" id="submit">Submit</button>
          <button type="button" id="next">Next</button>
        </div>
      </div>
    </div>
    <script src="quiz.js"></script>
  </body>
</html>
